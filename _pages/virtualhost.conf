---
permalink: /virtualhost.conf
---
ErrorDocument 404 /404.html

# ─── Block access to config file ──────────────────────────────────────
<Files "virtualhost.conf">
    Require all denied
</Files>

# ─── Security Headers ───────────────────────────────────────────────
Header set Cache-Control "max-age=7200, private"
Header set X-Frame-Options "SAMEORIGIN"
Header set X-XSS-Protection "0"
Header set Referrer-Policy "strict-origin-when-cross-origin"
Header set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
Header set Permissions-Policy "web-share=(self)"
Header set Content-Security-Policy "{% include csp.html.liquid %}"

# ─── Content-Type overrides ─────────────────────────────────────────
AddType application/manifest+json .webmanifest
<Files "manifest.json">
    ForceType application/manifest+json
</Files>

# ─── Cache & Content-Type for static assets ─────────────────────────
<FilesMatch "\.(css|js|png|jpg|jpeg|gif|webp)$">
    Header set Cache-Control "max-age=31536000, private"
</FilesMatch>

<FilesMatch "\.(css|js)$">
    Header set X-Content-Type-Options "nosniff"
</FilesMatch>

<Files "sw.js">
    Header set Cache-Control "max-age=0, private"
</Files>

# ─── Rewrite engine ─────────────────────────────────────────────────
RewriteEngine On

# ─── .well-known transparent rewrites ───────────────────────────────
# In VirtualHost context, patterns must include the leading slash
# QSA flag ensures query strings (e.g. ?v=E6jXRBAgkK) are passed through
RewriteRule ^/android-chrome-192x192\.png$ /.well-known/android-chrome-192x192.png [QSA,L]
RewriteRule ^/android-chrome-512x512\.png$ /.well-known/android-chrome-512x512.png [QSA,L]
RewriteRule ^/apple-touch-icon\.png$ /.well-known/apple-touch-icon.png [QSA,L]
RewriteRule ^/browserconfig\.xml$ /.well-known/browserconfig.xml [QSA,L]
RewriteRule ^/favicon-16x16\.png$ /.well-known/favicon-16x16.png [QSA,L]
RewriteRule ^/favicon-32x32\.png$ /.well-known/favicon-32x32.png [QSA,L]
RewriteRule ^/favicon\.ico$ /.well-known/favicon.ico [QSA,L]
RewriteRule ^/google04fb98c69ffff6cb\.html$ /.well-known/google04fb98c69ffff6cb.html [QSA,L]
RewriteRule ^/manifest\.json$ /.well-known/manifest.json [QSA,L]
RewriteRule ^/boris\.schapira\.dev\.webmanifest$ /.well-known/manifest.json [QSA,L]
RewriteRule ^/mstile-150x150\.png$ /.well-known/mstile-150x150.png [QSA,L]
RewriteRule ^/robots\.txt$ /.well-known/robots.txt [QSA,L]
RewriteRule ^/webfinger$ /.well-known/webfinger [QSA,L]

# ─── Legacy /:year/:month/:slug/ → /notes/:year-:month-:slug/ ──────
RewriteRule ^/([0-9]{4})/([0-9]{2})/([^/]+)/?$ /notes/$1-$2-$3/ [R=301,L]

# ─── External redirect ──────────────────────────────────────────────
Redirect 301 /bookmarks/ https://bookmarks.boris.schapira.dev/

# ─── Slug redirects (specific posts) ────────────────────────────────
Redirect 301 /notes/2018-06-gros/ /notes/2018-06-beau-a-l-interieur/
Redirect 301 /notes/2022-02-/ /notes/2022-02-le-meilleur/

# ─── Short URLs → assets ────────────────────────────────────────────
Redirect 301 /wcbdx /community/performance-web-vers-la-speed-update-un-pas-aprs-lautre/
Redirect 301 /20190611-node /assets/docs/2019-06-11/20190611-node.pdf
Redirect 301 /psconnect-bayonne /assets/docs/2019-07-05/psconnect-bayonne.pdf
Redirect 301 /webinar-papis-du-web /assets/docs/2020-04-07/clever-age-papis.pdf
Redirect 301 /ssq4 /assets/docs/2022-03-24/ssq4-boris-schapira-UX-technique.pdf
Redirect 301 /bdxio2022 /assets/docs/2022-12-02/bdxio-imposture-formation-continue.pdf
Redirect 301 /wls2023 /assets/docs/2023-05-10/wls2023-parlons-de-valeur.pdf

# ─── /notes/ → homepage ─────────────────────────────────────────────
RedirectMatch 301 ^/notes/$ /
